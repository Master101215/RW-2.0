title: RW 2.0
description: A VEX V5 autonomous template with odometry, PID motion control, and boomerang pathing.

url: https://master101215.github.io
baseurl: /RW-2.0

# Pages resolve as /configuration/ rather than /configuration.html,
# so {{ site.baseurl }}/configuration links work on GitHub Pages and locally.
permalink: pretty

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache

# ── Theme options ──────────────────────────────────────────────────────────
color_scheme: dark
search_enabled: true
heading_anchors: true

search:
  heading_level: 3
  previews: 3
  tokenizer_separator: /[\s/]+/

aux_links:
  "GitHub":
    - "https://github.com/Master101215/RW-2.0"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

callouts_level: quiet
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

footer_content: >-
  RW 2.0 &mdash; a VEX V5 autonomous template.
  Docs generated from the source in
  <a href="https://github.com/Master101215/RW-2.0">Master101215/RW-2.0</a>.

# ── Build ──────────────────────────────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
